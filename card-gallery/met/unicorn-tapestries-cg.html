<!DOCTYPE html>
<html lang="en">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // ─── CONFIG ───────────────────────────────────────────────────────────────
        // Edit this object to change content and design. The rest of the file is
        // the template — leave it alone.

        const CONFIG = {

          meta: {
            pageTitle:  "The Hunt of the Unicorn",
            heroTitle:  "The Hunt of the Unicorn",
            shortTitle: "Unicorn Tapestries",
            subtitle:   "Seven medieval tapestries at The Met Cloisters",
            footerText: "The Unicorn Tapestries. Southern Netherlands (Flemish), c. 1495–1505. Wool, silk, silver, and gilt wefts. The Metropolitan Museum of Art, The Met Cloisters, Gift of John D. Rockefeller Jr., 1937. All images CC0.",
            backHref:   "./",
            backLabel:  "← The Met"
          },

          defaultTheme: 'coal',

          themes: [
            {
              id:   'coal',
              name: 'Coal',
              dark: true,
              colors: { 50: '#fdfbf7', 100: '#f6f2e9', 200: '#e8dfcd', 800: '#2a2825', 900: '#1a1815' }
            },
            {
              id:   'navy',
              name: 'Navy',
              dark: true,
              colors: { 50: '#f0f4fb', 100: '#dce8f5', 200: '#c7d2e8', 800: '#1a2744', 900: '#0f1729' }
            },
            {
              id:   'forest',
              name: 'Forest',
              dark: true,
              colors: { 50: '#f0f5f1', 100: '#dceee0', 200: '#c7d8cb', 800: '#1a3a22', 900: '#0f2014' }
            },
            {
              id:   'parchment',
              name: 'Parchment',
              dark: false,
              colors: { 50: '#fdfbf7', 100: '#f6f2e9', 200: '#e8dfcd', 800: '#2a2825', 900: '#1a1815' }
            }
          ],

          hero: {
            imageUrl: "https://commons.wikimedia.org/wiki/Special:FilePath/The_Unicorn_in_Captivity_%28from_the_Unicorn_Tapestries%29_MET_DP101251.jpg",
            imageAlt: "Tapestry 7 — the resurrected unicorn rests in a millefleurs garden, c. 1495–1505",
            ctaText:  "Enter the Gallery"
          },

          sections: [

            {
              id:       "pursuit-begins",
              navLabel: "The Pursuit",
              part:     "Part I",
              title:    "The Pursuit Begins",
              intro:    "A company of noblemen, grooms, and hounds rides out at dawn to hunt the most elusive creature in the world. The first two tapestries set the scene: a dense Flemish forest alive with a hundred botanically precise herbs and flowers, and the unicorn discovered at a fountain where all animals drink together.",
              cards: [
                {
                  imageUrl:     "https://commons.wikimedia.org/wiki/Special:FilePath/The_Hunters_Enter_the_Woods_%28from_the_Unicorn_Tapestries%29_MET_DP100989.jpg",
                  imageAlt:     "Tapestry 1 — hunters and hounds enter a forest in search of the unicorn, c. 1495–1505",
                  imageCaption: "Tapestry 1: The Hunters Enter the Woods. Southern Netherlands, c. 1495–1505. The Met Cloisters.",
                  name:         "The Hunters Enter the Woods",
                  label:        "Tapestry 1 — c. 1495–1505",
                  paragraphs: [
                    "The hunt opens with ceremony. A richly dressed hunting party — noblemen in fine wool, grooms in livery, hounds straining at their leashes — moves into a dense forest at first light. Two scouts at the far left peer into the undergrowth. The whole composition conveys anticipation: the quarry is close, but not yet seen.",
                    "The forest floor is one of the tapestries' most astonishing achievements. More than a hundred plant species appear across the seven panels, each rendered with the precision of a botanical illustration. Violet, strawberry, iris, columbine, and dozens of others crowd the ground. Medieval viewers would have read them symbolically: the violet for humility, the strawberry for righteousness, the thistle for the Passion of Christ.",
                    "Scholars believe the tapestries were woven in the Southern Netherlands — likely Brussels or Liège — by master weavers working from cartoons drawn by an unknown designer. A set of this scale and ambition required dozens of skilled hands over several years. Who commissioned them remains one of the great unsolved questions in the history of decorative arts."
                  ],
                  footerLabel: "The Met Cloisters",
                  footerText:  "Gallery 17, Fort Tryon Park, New York. Gift of John D. Rockefeller Jr., 1937."
                },
                {
                  imageUrl:     "https://commons.wikimedia.org/wiki/Special:FilePath/The_Unicorn_is_Found_%28from_the_Unicorn_Tapestries%29_MET_DP101079.jpg",
                  imageAlt:     "Tapestry 2 — the unicorn dips its horn into a fountain to purify the water, surrounded by hunters and animals, c. 1495–1505",
                  imageCaption: "Tapestry 2: The Unicorn is Found. Southern Netherlands, c. 1495–1505. The Met Cloisters.",
                  name:         "The Unicorn is Found",
                  label:        "Tapestry 2 — c. 1495–1505",
                  paragraphs: [
                    "At a stone fountain in the forest, animals of every kind have gathered to drink — lion, leopard, stag, rabbit, and birds perch at the basin's edge. At the center, the unicorn dips the tip of its horn into the water. According to medieval belief, unicorn horn could detect and neutralize poison; this act of purification was a gift to the assembled creatures.",
                    "The hunters observe from a distance, their spears held low. It is a moment of extraordinary stillness in a series that will soon turn violent. The composition radiates outward from the unicorn — animals arranged in a heraldic symmetry that emphasizes the creature's centrality and symbolic power.",
                    "Medieval audiences also recognized a Christological reading: the unicorn purifying a poisoned spring echoes Christ's power to heal and redeem. This dual register — secular hunting narrative and religious allegory — runs throughout all seven tapestries and was likely built in by the original designer. Whether owner or viewer chose one reading or held both simultaneously, the imagery would have sustained both."
                  ],
                  footerLabel: "The Met Cloisters",
                  footerText:  "Gallery 17, Fort Tryon Park, New York. Gift of John D. Rockefeller Jr., 1937."
                }
              ]
            },

            {
              id:       "the-battle",
              navLabel: "The Battle",
              part:     "Part II",
              title:    "The Battle",
              intro:    "The hunt turns violent. In two turbulent tapestries, the hunters close in with spears and hounds, and the unicorn fights for its life. The weaving technique reaches its peak here — every figure in diagonal motion, the textures of fur, water, and metal rendered thread by thread.",
              cards: [
                {
                  imageUrl:     "https://commons.wikimedia.org/wiki/Special:FilePath/The_Unicorn_is_Attacked_%28from_the_Unicorn_Tapestries%29_MET_DP101087.jpg",
                  imageAlt:     "Tapestry 3 — hunters and hounds attack the unicorn as it leaps a stream, c. 1495–1505",
                  imageCaption: "Tapestry 3: The Unicorn is Attacked. Southern Netherlands, c. 1495–1505. The Met Cloisters.",
                  name:         "The Unicorn is Attacked",
                  label:        "Tapestry 3 — c. 1495–1505",
                  paragraphs: [
                    "The stillness of the fountain scene shatters. Hounds bite at the unicorn's legs; hunters thrust with spears from both sides; the unicorn bounds across a narrow stream in a great diagonal leap that carries it toward the right edge of the panel. The composition is all kinetic energy — every line of force converges on the creature in mid-flight.",
                    "The weaving here is a technical tour de force. The weavers had to render individual water droplets, the sheen of the unicorn's white coat against bloodied flanks, the glint of steel spear tips, and the varied textures of bark, leaf, and stone — all in wool and silk on a loom. The resolution is extraordinary: details invisible to the naked eye emerge under close examination.",
                    "The violence is unflinching. These tapestries were made for a noble household accustomed to real hunting as a central social ritual, and the brutality was not softened. What distinguished the unicorn hunt from an ordinary stag hunt was its symbolic freight — the quarry was magical, its death meaningful, its eventual resurrection redemptive."
                  ],
                  footerLabel: "The Met Cloisters",
                  footerText:  "Gallery 17, Fort Tryon Park, New York. Gift of John D. Rockefeller Jr., 1937."
                },
                {
                  imageUrl:     "https://commons.wikimedia.org/wiki/Special:FilePath/The_Unicorn_Defends_Itself_%28from_the_Unicorn_Tapestries%29_MET_DP101151.jpg",
                  imageAlt:     "Tapestry 4 — the wounded unicorn fights back against the hunters, c. 1495–1505",
                  imageCaption: "Tapestry 4: The Unicorn Defends Itself. Southern Netherlands, c. 1495–1505. The Met Cloisters.",
                  name:         "The Unicorn Defends Itself",
                  label:        "Tapestry 4 — c. 1495–1505",
                  paragraphs: [
                    "Cornered, the unicorn turns. It kicks a hunter with its hind hooves and gores a hound with its spiraling horn. The figures press in from all sides — hunters with swords drawn, hounds snarling — but the unicorn is not yet beaten. There is something admirable in the resistance: the tapestry does not ask us to root only for the hunters.",
                    "Medieval depictions of the unicorn consistently emphasize its untameable quality. Only one force could subdue it — a maiden of perfect virtue, whose lap it would voluntarily approach. The next two tapestries will turn on this legend. But first the creature must fight to exhaustion, and the weavers make sure we see the cost.",
                    "The mille-fleurs background continues its quiet counterpoint. While men and hounds press inward in violent arcs, the flowers at the margins maintain their serene botanical precision — violet, iris, columbine, each in its proper season, each carrying its symbolic meaning. The contrast between foreground violence and background order is one of the series' most unsettling recurring effects."
                  ],
                  footerLabel: "The Met Cloisters",
                  footerText:  "Gallery 17, Fort Tryon Park, New York. Gift of John D. Rockefeller Jr., 1937."
                }
              ]
            },

            {
              id:       "capture-and-death",
              navLabel: "Capture & Death",
              part:     "Part III",
              title:    "Capture and Death",
              intro:    "A maiden where no man could succeed — and a triumph that arrives like a processional. The middle tapestries turn on the most distinctive element of unicorn mythology: that the creature could only be caught by a young woman of pure virtue, and that once caught, it would be brought before a lord and lady as the supreme trophy of the hunt.",
              cards: [
                {
                  imageUrl:     "https://commons.wikimedia.org/wiki/Special:FilePath/The_Mystic_Capture_of_the_Unicorn_%28from_the_Unicorn_Tapestries%29_MET_DP118501.jpg",
                  imageAlt:     "Tapestry 5 — the unicorn surrenders peacefully to a maiden in a garden, c. 1495–1505",
                  imageCaption: "Tapestry 5: The Mystic Capture of the Unicorn. Southern Netherlands, c. 1495–1505. The Met Cloisters.",
                  name:         "The Mystic Capture of the Unicorn",
                  label:        "Tapestry 5 — c. 1495–1505",
                  paragraphs: [
                    "In a walled garden apart from the forest, a young woman sits beneath a tree. The exhausted unicorn approaches her and lays its head in her lap. The hunters wait at the garden wall, spears lowered, watching in silence. The violence has stopped. The creature that no man could hold yields willingly to the maiden.",
                    "The \"virgin capture\" tradition appears in classical sources but became fully developed in medieval bestiaries. The symbolic parallel was obvious to medieval viewers: as the unicorn chose the maiden, Christ chose the Virgin. The enclosed garden — hortus conclusus — was another Marian symbol. The tapestry layers these meanings deliberately.",
                    "This tapestry survives as two fragments, now displayed side by side. What was lost between them remains unknown. The DP118501 file shows the assembled pair, and the composition reads as complete enough to reconstruct the original arrangement — but the lost section may have contained additional figures or text."
                  ],
                  footerLabel: "The Met Cloisters",
                  footerText:  "Gallery 17, Fort Tryon Park, New York. Two fragments assembled. Gift of John D. Rockefeller Jr., 1937."
                },
                {
                  imageUrl:     "https://commons.wikimedia.org/wiki/Special:FilePath/The_Unicorn_is_Killed_and_Brought_to_the_Castle_%28from_the_Unicorn_Tapestries%29_MET_DP101236.jpg",
                  imageAlt:     "Tapestry 6 — the slain unicorn is carried in triumph to a castle, c. 1495–1505",
                  imageCaption: "Tapestry 6: The Unicorn is Killed and Brought to the Castle. Southern Netherlands, c. 1495–1505. The Met Cloisters.",
                  name:         "The Unicorn is Killed and Brought to the Castle",
                  label:        "Tapestry 6 — c. 1495–1505",
                  paragraphs: [
                    "The unicorn is dead. Its body is draped across a horse and carried in procession toward a castle gate, where a richly dressed lord and lady wait to receive the prize. Hunters flank the horse; a crowd gathers at the gate. The mood is triumphal but the image is also heavy — the white body, the drooping horn, the blood.",
                    "This tapestry has the largest number of surviving detail photographs of any in the series — 31 separate close-ups in the MET Open Access archive — suggesting that scholars and conservators have found it especially revealing. The faces of the castle crowd, the textures of the castle stonework, and the lord and lady's expressions repay close examination.",
                    "The processional structure deliberately echoes triumphal entries — a visual vocabulary familiar to the tapestries' original owners from actual state ceremonies. The unicorn's body as civic trophy collapses the secular and the sacred in a way that would have been deeply legible to a fifteenth-century courtly audience."
                  ],
                  footerLabel: "The Met Cloisters",
                  footerText:  "Gallery 17, Fort Tryon Park, New York. Gift of John D. Rockefeller Jr., 1937."
                }
              ]
            },

            {
              id:       "the-resurrection",
              navLabel: "Resurrection",
              part:     "Part IV",
              title:    "The Resurrection",
              intro:    "The final tapestry stands alone — and it is the most famous image of the seven. The unicorn is alive again, enclosed within a low circular fence in a garden of flowers. Its meaning has never been settled.",
              cards: [
                {
                  imageUrl:     "https://commons.wikimedia.org/wiki/Special:FilePath/The_Unicorn_in_Captivity_%28from_the_Unicorn_Tapestries%29_MET_DP101251.jpg",
                  imageAlt:     "Tapestry 7 — the resurrected unicorn rests within a millefleurs garden enclosed by a fence, c. 1495–1505",
                  imageCaption: "Tapestry 7: The Unicorn in Captivity. Southern Netherlands, c. 1495–1505. The Met Cloisters.",
                  name:         "The Unicorn in Captivity",
                  label:        "Tapestry 7 — c. 1495–1505",
                  paragraphs: [
                    "The dead unicorn is alive. It rests in a small circular enclosure of low wooden fencing, chained to a pomegranate tree heavy with ripening fruit. The ground is covered with dozens of flowering plants rendered with the same botanical precision as the rest of the series. The unicorn looks out at the viewer, its expression unreadable — serene, perhaps, or resigned. It is the most iconic image in the entire series.",
                    "Two readings have persisted for five centuries. In the religious reading, the unicorn is Christ: killed, now risen, dwelling in the paradise garden. The pomegranate tree, symbol of resurrection in both Christian and classical tradition, reinforces this. The enclosed garden is Paradise. The chain is not restraint but a sign of willing presence — the lamb that lies down in the new creation.",
                    "In the secular reading, the unicorn is a bridegroom: tamed by marriage to a noble lady, dwelling now in the enclosed garden of the household. The circular fence is the boundary of domestic life; the chain is the bond of love. Woven into the wooden fence posts are the letters AE and FR in Gothic script — the initials, almost certainly, of the original owners. Who they were has never been confirmed."
                  ],
                  footerLabel: "The Met Cloisters",
                  footerText:  "Gallery 17, Fort Tryon Park, New York. Gift of John D. Rockefeller Jr., 1937."
                }
              ],
              blockquote: {
                text:          "Two letters, five hundred years of silence.",
                attribution:   "The AE/FR monogram woven into the fence of Tapestry 7 — identity unknown"
              }
            }

          ],

          coda: {
            id:       "coda",
            navLabel: "About",
            part:     "The Tapestries",
            title:    "Five Centuries of Questions",
            intro:    "The Unicorn Tapestries are among the finest surviving works of late medieval art. They also remain, in the most fundamental ways, mysterious.",
            cards: [
              {
                title: "Who Made Them?",
                text:  "The tapestries were almost certainly woven in the Southern Netherlands — Brussels or Liège — around 1495–1505. Master weavers there produced the finest textiles in Europe, working from cartoons (painted designs on paper) supplied by an unknown designer. A set of this scale — seven large panels in wool, silk, silver, and gilt thread — required years of work from dozens of skilled hands. They were acquired by John D. Rockefeller Jr. in 1922 and given to The Met Cloisters in 1937, where they have hung ever since."
              },
              {
                title: "The Mille-Fleurs Garden",
                text:  "More than a hundred plant species appear across the seven tapestries, each rendered with the accuracy of a medieval herbal. None are merely decorative. Violet signifies humility; strawberry, righteousness; thistle, the Passion; columbine, the Holy Spirit. The iris, the carnation, the periwinkle — each carries a meaning a fifteenth-century viewer would have recognized. The mille-fleurs (thousand flowers) tradition turned the garden into a text, legible to those who knew the grammar of plants."
              },
              {
                title: "The AE/FR Monogram",
                text:  "Woven into the fence posts of Tapestry 7 are two pairs of Gothic letters: AE and FR. They are almost certainly the initials of the couple who originally owned the tapestries. Scholars have proposed Anne of France and her husband François de la Tour d'Auvergne, and others. None has been confirmed. After five hundred years, the identity of the people who commissioned the most famous medieval tapestries in America remains unknown."
              }
            ],
            closingLine: "Gallery 17, The Met Cloisters — open year-round."
          }

        }; // end CONFIG

        tailwind.config = {

<body id="body" class="antialiased selection:bg-amber-700 selection:text-white">

    <div id="app"></div>

    <!-- Gear Picker -->
    <div style="position:fixed; bottom:1.5rem; right:1.5rem; z-index:50;" class="relative">
        <button id="theme-btn" onclick="togglePicker()" class="w-12 h-12 rounded-full flex items-center justify-center text-2xl art-shadow transition-colors duration-300 focus:outline-none hover:scale-105" aria-label="Change Theme">&#9881;</button>
        <div id="picker-panel" class="absolute bottom-16 right-0 w-48 rounded-lg art-shadow overflow-hidden hidden transition-colors duration-300">
            <!-- populated by js -->
        </div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="fixed inset-0 z-[100] bg-black/90 hidden flex-col items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <button onclick="closeLightbox()" class="absolute top-6 right-6 text-white hover:text-amber-500 text-4xl font-light focus:outline-none">&times;</button>
        <img id="lightbox-img" src="" alt="" class="max-w-full max-h-[85vh] object-contain shadow-2xl">
        <p id="lightbox-caption" class="text-gallery-200 mt-4 font-serif text-lg text-center max-w-3xl"></p>
    </div>

    <script>
        let activeTheme = CONFIG.themes.find(t => t.id === CONFIG.defaultTheme) || CONFIG.themes[0];

        function applyTheme(theme) {
            const r = document.documentElement;
            r.style.setProperty("--g50",  theme.colors[50]);
            r.style.setProperty("--g100", theme.colors[100]);
            r.style.setProperty("--g200", theme.colors[200]);
            r.style.setProperty("--g800", theme.colors[800]);
            r.style.setProperty("--g900", theme.colors[900]);
        }

        function switchTheme(themeId) {
            activeTheme = CONFIG.themes.find(t => t.id === themeId);
            applyTheme(activeTheme);
            render();
            document.querySelectorAll(".fade-in-section").forEach(el => el.classList.add("is-visible"));
            updatePickerUI();
        }

        function togglePicker() {
            const panel = document.getElementById("picker-panel");
            panel.classList.toggle("hidden");
        }

        function updatePickerUI() {
            const btn = document.getElementById("theme-btn");
            const panel = document.getElementById("picker-panel");

            btn.className = `w-12 h-12 rounded-full flex items-center justify-center text-2xl art-shadow transition-colors duration-300 focus:outline-none hover:scale-105 bg-gallery-800 text-gallery-200`;
            panel.className = `absolute bottom-16 right-0 w-48 rounded-lg art-shadow overflow-hidden hidden transition-colors duration-300 bg-gallery-800`;

            let html = '<div class="py-2">';
            CONFIG.themes.forEach(t => {
                const isActive = t.id === activeTheme.id;
                const textClass = isActive ? "text-amber-500 font-bold" : "text-gallery-100 hover:text-gallery-200";
                html += `<button onclick="switchTheme('${t.id}')" class="w-full text-left px-4 py-2 text-sm transition-colors ${textClass}">${t.name}</button>`;
            });
            html += '</div>';
            panel.innerHTML = html;
        }

        function openLightbox(url, caption) {
            const lb = document.getElementById("lightbox");
            document.getElementById("lightbox-img").src = url;
            document.getElementById("lightbox-caption").innerText = caption;
            lb.classList.remove("hidden");
            lb.classList.add("flex");
            setTimeout(() => { lb.classList.remove("opacity-0"); lb.classList.add("opacity-100"); }, 10);
            document.body.style.overflow = "hidden";
        }

        function closeLightbox() {
            const lb = document.getElementById("lightbox");
            lb.classList.remove("opacity-100");
            lb.classList.add("opacity-0");
            setTimeout(() => {
                lb.classList.add("hidden");
                lb.classList.remove("flex");
                document.getElementById("lightbox-img").src = "";
            }, 300);
            document.body.style.overflow = "";
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !document.getElementById('lightbox').classList.contains('hidden')) closeLightbox();
        });
        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target.id === 'lightbox') closeLightbox();
        });

        function toggleAccordion(btn) {
            const content = btn.nextElementSibling;
            const icon = btn.querySelector('.chevron');
            if (content.style.maxHeight) {
                content.style.maxHeight = null;
                icon.style.transform = "rotate(0deg)";
            } else {
                content.style.maxHeight = content.scrollHeight + "px";
                icon.style.transform = "rotate(180deg)";
            }
        }

        function render() {
            const dark = activeTheme.dark;

            const body = document.getElementById("body");
            body.className = `antialiased selection:bg-amber-700 selection:text-white font-sans ${dark ? 'bg-gallery-900 text-gallery-100' : 'bg-gallery-50 text-gallery-800'}`;

            const navClasses = dark ? 'bg-gallery-900/95 border-gallery-800' : 'bg-gallery-50/90 border-gallery-200';
            const navLinks = CONFIG.sections.map(s => `<a href="#${s.id}" class="hover:text-amber-500 transition-colors">${s.navLabel}</a>`).join('');
            const backLink = CONFIG.meta.backHref
                ? `<a href="${CONFIG.meta.backHref}" class="hover:text-amber-500 transition-colors">${CONFIG.meta.backLabel || '← Back'}</a>`
                : '';

            const heroGradient = dark ? 'from-gallery-900/30 via-gallery-900/70 to-gallery-900' : 'from-gallery-50/50 via-gallery-50/80 to-gallery-50';
            const btnClasses = dark ? 'border-gallery-100 text-gallery-100 hover:bg-gallery-100 hover:text-gallery-900' : 'border-gallery-800 text-gallery-800 hover:bg-gallery-800 hover:text-white';

            let html = `
                <nav class="fixed top-0 w-full z-50 backdrop-blur-md border-b ${navClasses}">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div class="flex justify-between h-16 items-center">
                            <a href="#" class="font-serif font-bold text-xl tracking-tight flex items-center hover:text-amber-500 transition-colors">${CONFIG.meta.shortTitle}</a>
                            <div class="hidden md:flex space-x-8 text-sm uppercase tracking-wider font-semibold items-center">
                                <a href="#" class="text-xl leading-none hover:text-amber-500 transition-colors" title="Home">&#8962;</a>
                                ${backLink}
                                ${navLinks}
                                <a href="#${CONFIG.coda.id}" class="hover:text-amber-500 transition-colors">${CONFIG.coda.navLabel}</a>
                            </div>
                        </div>
                    </div>
                </nav>

                <header class="relative h-screen flex items-center justify-center overflow-hidden">
                    <div class="absolute inset-0 z-0">
                        <img src="${CONFIG.hero.imageUrl}?width=1600" alt="${CONFIG.hero.imageAlt}" class="w-full h-full object-cover opacity-30 filter blur-sm transform scale-105">
                        <div class="absolute inset-0 bg-gradient-to-b ${heroGradient}"></div>
                    </div>
                    <div class="relative z-10 text-center max-w-4xl px-4 fade-in-section">
                        <h1 class="font-serif text-5xl md:text-7xl font-bold mb-6 leading-tight">${CONFIG.meta.heroTitle}</h1>
                        <p class="text-xl md:text-2xl font-serif italic mb-8 ${dark ? 'text-gallery-200' : 'text-gallery-800'}">${CONFIG.meta.subtitle}</p>
                        <a href="#${CONFIG.sections[0].id}" class="inline-block border-2 px-8 py-3 uppercase tracking-widest text-sm transition-all duration-300 ${btnClasses}">${CONFIG.hero.ctaText}</a>
                    </div>
                </header>

                <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
            `;

            CONFIG.sections.forEach(sec => {
                const gridCols = sec.cards.length === 2 ? 'md:grid-cols-2' : (sec.cards.length === 3 ? 'md:grid-cols-3' : 'md:grid-cols-1 max-w-3xl mx-auto');
                const imgHeight = sec.cards.length === 2 ? 'h-64' : 'h-48';

                html += `
                    <section id="${sec.id}" class="py-16 md:py-24 border-b ${dark ? 'border-gallery-800' : 'border-gallery-200'} fade-in-section">
                        <div class="text-center max-w-3xl mx-auto mb-16">
                            <h2 class="text-xs uppercase tracking-widest text-amber-500 mb-2 font-bold">${sec.part}</h2>
                            <h3 class="font-serif text-4xl mb-6">${sec.title}</h3>
                            <p class="text-lg">${sec.intro}</p>
                        </div>

                        <div class="grid grid-cols-1 ${gridCols} gap-8">
                `;

                sec.cards.forEach((card) => {
                    const ps = card.paragraphs.map(p => `<p>${p}</p>`).join('');
                    const pos = card.imagePosition || 'object-center';
                    html += `
                        <div class="bg-gallery-900 text-gallery-100 p-6 md:p-8 art-shadow flex flex-col h-full border-t-4 border-gallery-800">
                            <img src="${card.imageUrl}?width=800" loading="lazy" alt="${card.imageAlt}" class="w-full ${imgHeight} object-cover ${pos} mb-6 cursor-pointer hover:opacity-90 transition-opacity" onclick="openLightbox('${card.imageUrl}?width=1600', '${card.imageCaption.replace(/'/g, "\\'")}')">
                            <h4 class="font-serif text-2xl mb-1">${card.name}</h4>
                            <span class="text-xs uppercase tracking-widest text-amber-500 mb-6 block">${card.label}</span>

                            <button class="w-full flex justify-between items-center py-2 text-sm font-bold uppercase tracking-wider text-gallery-200 hover:text-amber-500 transition-colors border-t border-gallery-800 focus:outline-none" onclick="toggleAccordion(this)">
                                Read More
                                <svg class="chevron w-4 h-4 transform transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </button>
                            <div class="accordion-content">
                                <div class="pt-4 space-y-4 text-sm flex-grow">
                                    ${ps}
                                </div>
                                <div class="mt-6 pt-4 border-t border-gallery-800">
                                    <strong class="text-amber-500 block mb-1">${card.footerLabel}</strong>
                                    <p class="text-sm">${card.footerText}</p>
                                </div>
                            </div>
                        </div>
                    `;
                });

                html += `</div>`;

                if (sec.blockquote) {
                    html += `
                        <blockquote class="border-l-4 border-amber-500 pl-6 my-16 max-w-4xl mx-auto font-serif italic text-2xl ${dark ? 'text-gallery-200' : 'text-gallery-800'}">
                            "${sec.blockquote.text}"
                            <footer class="text-sm uppercase tracking-widest mt-4 font-sans not-italic text-amber-500">— ${sec.blockquote.attribution}</footer>
                        </blockquote>
                    `;
                }

                if (sec.closingLine) {
                    html += `<p class="mt-12 text-center max-w-4xl mx-auto italic">${sec.closingLine}</p>`;
                }

                html += `</section>`;
            });

            html += `
                <section id="${CONFIG.coda.id}" class="py-16 md:py-24 fade-in-section">
                    <div class="max-w-4xl mx-auto">
                        <h2 class="text-xs uppercase tracking-widest text-amber-500 mb-2 font-bold text-center">${CONFIG.coda.part}</h2>
                        <h3 class="font-serif text-4xl mb-8 text-center">${CONFIG.coda.title}</h3>
                        <p class="text-xl mb-12 text-center font-serif">${CONFIG.coda.intro}</p>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-16">
            `;

            CONFIG.coda.cards.forEach(card => {
                html += `
                    <div class="bg-gallery-900 text-gallery-100 p-6 art-shadow border-t-4 border-gallery-800">
                        <h4 class="font-bold mb-3 text-lg text-amber-500">${card.title}</h4>
                        <p class="text-sm">${card.text}</p>
                    </div>
                `;
            });

            html += `
                        </div>
            `;
            if (CONFIG.coda.closingLine) {
                html += `<div class="bg-gallery-900 text-gallery-100 p-8 md:p-12 text-center art-shadow">
                            <h4 class="font-serif text-2xl text-amber-500 italic">${CONFIG.coda.closingLine}</h4>
                         </div>`;
            }
            html += `
                    </div>
                </section>
            </main>

            <footer class="bg-gallery-900 text-gallery-200 py-8 text-center text-sm">
                <p>${CONFIG.meta.footerText}</p>
            </footer>
            `;

            document.getElementById("app").innerHTML = html;
        }

        applyTheme(activeTheme);
        render();
        updatePickerUI();

        setTimeout(() => {
            const observerOptions = { root: null, rootMargin: '0px', threshold: 0.15 };
            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, observerOptions);
            document.querySelectorAll('.fade-in-section').forEach(section => observer.observe(section));
        }, 100);

    </script>
</body>
</html>
