          imageUrl:     "https://commons.wikimedia.org/wiki/Special:FilePath/Carl_Bloch_-_In_a_Roman_Osteria_-_Google_Art_Project.jpg",

      cards: [
        {
          imageUrl:     "https://images.unsplash.com/photo-1526318896980-cf78c088247c",

          name:         "Jun Sakamoto",

            "Jun Sakamoto on Rua Lisboa 55 holds a Michelin star and is regarded as one of the finest sushi restaurants in the Americas. Chef Sakamoto's omakase menus — precise, seasonal, and deeply personal — are built entirely on what the market offers that morning. There is no menu, no à la carte, no choices to make. You sit, you trust, and the kitchen takes care of everything."
          ],

          footerText:  "Jun Sakamoto · R. Lisboa 55 · Pinheiros · Michelin-starred omakase · Book weeks in advance"
        },
        {
          imageUrl:     "https://images.unsplash.com/photo-1648971413826-8377e3c65039",

    cards: [
      {
        title: "A City of Immigrants",

      },
      {
        title: "The Neighbourhood",
        text:  "Pinheiros sits west of the city centre, between the Rio Pinheiros and Vila Madalena. Its food scene developed quietly through the twentieth century and accelerated after 2000, when chefs from across the city began choosing it for their most ambitious openings. Today Rua Cônego Eugênio Leite alone holds more serious restaurants per block than most cities have in an entire district."
      },
      {
        title: "The Next Table",

    <style>
        :root { --g50: #000; --g100: #000; --g200: #000; --g800: #000; --g900: #000; }
        .fade-in-section {
          opacity: 0; transform: translateY(20px);
          transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }
        .fade-in-section.is-visible { opacity: 1; transform: none; }
        .art-shadow { box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2), 0 10px 10px -5px rgba(0,0,0,0.1); }
        .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease; }
    </style>
</head>
<body id="body" class="antialiased selection:bg-amber-700 selection:text-white">

    <div id="app"></div>

    <!-- Gear Picker -->
    <div style="position:fixed; bottom:1.5rem; right:1.5rem; z-index:50;" class="relative">
        <button id="theme-btn" onclick="togglePicker()" class="w-12 h-12 rounded-full flex items-center justify-center text-2xl art-shadow transition-colors duration-300 focus:outline-none hover:scale-105" aria-label="Change Theme">&#9881;</button>
        <div id="picker-panel" class="absolute bottom-16 right-0 w-48 rounded-lg art-shadow overflow-hidden hidden transition-colors duration-300">
            <!-- populated by js -->
        </div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="fixed inset-0 z-[100] bg-black/90 hidden flex-col items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <button onclick="closeLightbox()" class="absolute top-6 right-6 text-white hover:text-amber-500 text-4xl font-light focus:outline-none">&times;</button>
        <img id="lightbox-img" src="" alt="" class="max-w-full max-h-[85vh] object-contain shadow-2xl">
        <p id="lightbox-caption" class="text-gallery-200 mt-4 font-serif text-lg text-center max-w-3xl"></p>
    </div>

    <script>
        let activeTheme = CONFIG.themes.find(t => t.id === CONFIG.defaultTheme) || CONFIG.themes[0];

        function makeImgUrl(url, size) {
            if (url.includes('unsplash.com')) {
                return url + '?w=' + size + '&auto=format&fit=crop';
            }
            return url + '?width=' + size;
        }

        function applyTheme(theme) {
            const r = document.documentElement;
            r.style.setProperty("--g50",  theme.colors[50]);
            r.style.setProperty("--g100", theme.colors[100]);
            r.style.setProperty("--g200", theme.colors[200]);
            r.style.setProperty("--g800", theme.colors[800]);
            r.style.setProperty("--g900", theme.colors[900]);
        }

        function switchTheme(themeId) {
            activeTheme = CONFIG.themes.find(t => t.id === themeId);
            applyTheme(activeTheme);
            render();
            document.querySelectorAll(".fade-in-section").forEach(el => el.classList.add("is-visible"));
            updatePickerUI();
        }

        function togglePicker() {
            const panel = document.getElementById("picker-panel");
            panel.classList.toggle("hidden");
        }

        function updatePickerUI() {
            const btn = document.getElementById("theme-btn");
            const panel = document.getElementById("picker-panel");

            btn.className = `w-12 h-12 rounded-full flex items-center justify-center text-2xl art-shadow transition-colors duration-300 focus:outline-none hover:scale-105 bg-gallery-800 text-gallery-200`;
            panel.className = `absolute bottom-16 right-0 w-48 rounded-lg art-shadow overflow-hidden hidden transition-colors duration-300 bg-gallery-800`;

            let html = '<div class="py-2">';
            CONFIG.themes.forEach(t => {
                const isActive = t.id === activeTheme.id;
                const textClass = isActive ? "text-amber-500 font-bold" : "text-gallery-100 hover:text-gallery-200";
                html += `<button onclick="switchTheme('${t.id}')" class="w-full text-left px-4 py-2 text-sm transition-colors ${textClass}">${t.name}</button>`;
            });
            html += '</div>';
            panel.innerHTML = html;
        }

        function openLightbox(url, caption) {
            const lb = document.getElementById("lightbox");
            document.getElementById("lightbox-img").src = url;
            document.getElementById("lightbox-caption").innerText = caption;
            lb.classList.remove("hidden");
            lb.classList.add("flex");
            setTimeout(() => { lb.classList.remove("opacity-0"); lb.classList.add("opacity-100"); }, 10);
            document.body.style.overflow = "hidden";
        }

        function closeLightbox() {
            const lb = document.getElementById("lightbox");
            lb.classList.remove("opacity-100");
            lb.classList.add("opacity-0");
            setTimeout(() => {
                lb.classList.add("hidden");
                lb.classList.remove("flex");
                document.getElementById("lightbox-img").src = "";
            }, 300);
            document.body.style.overflow = "";
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !document.getElementById('lightbox').classList.contains('hidden')) closeLightbox();
        });
        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target.id === 'lightbox') closeLightbox();
        });

        function toggleAccordion(btn) {
            const content = btn.nextElementSibling;
            const icon = btn.querySelector('.chevron');
            if (content.style.maxHeight) {
                content.style.maxHeight = null;
                icon.style.transform = "rotate(0deg)";
            } else {
                content.style.maxHeight = content.scrollHeight + "px";
                icon.style.transform = "rotate(180deg)";
            }
        }

        function render() {
            const dark = activeTheme.dark;

            const body = document.getElementById("body");
            body.className = `antialiased selection:bg-amber-700 selection:text-white font-sans ${dark ? 'bg-gallery-900 text-gallery-100' : 'bg-gallery-50 text-gallery-800'}`;

            const navClasses = dark ? 'bg-gallery-900/95 border-gallery-800' : 'bg-gallery-50/90 border-gallery-200';
            const navLinks = CONFIG.sections.map(s => `<a href="#${s.id}" class="hover:text-amber-500 transition-colors">${s.navLabel}</a>`).join('');
            const backLink = CONFIG.meta.backHref
                ? `<a href="${CONFIG.meta.backHref}" class="hover:text-amber-500 transition-colors">${CONFIG.meta.backLabel || '← Back'}</a>`
                : '';

            const heroGradient = dark ? 'from-gallery-900/30 via-gallery-900/70 to-gallery-900' : 'from-gallery-50/50 via-gallery-50/80 to-gallery-50';
            const btnClasses = dark ? 'border-gallery-100 text-gallery-100 hover:bg-gallery-100 hover:text-gallery-900' : 'border-gallery-800 text-gallery-800 hover:bg-gallery-800 hover:text-white';

            let html = `
                <nav class="fixed top-0 w-full z-50 backdrop-blur-md border-b ${navClasses}">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div class="flex justify-between h-16 items-center">
                            <a href="#" class="font-serif font-bold text-xl tracking-tight flex items-center hover:text-amber-500 transition-colors">${CONFIG.meta.shortTitle}</a>
                            <div class="hidden md:flex space-x-8 text-sm uppercase tracking-wider font-semibold items-center">
                                <a href="#" class="text-xl leading-none hover:text-amber-500 transition-colors" title="Home">&#8962;</a>
                                ${backLink}
                                ${navLinks}
                                <a href="#${CONFIG.coda.id}" class="hover:text-amber-500 transition-colors">${CONFIG.coda.navLabel}</a>
                            </div>
                        </div>
                    </div>
                </nav>

                <header class="relative h-screen flex items-center justify-center overflow-hidden">
                    <div class="absolute inset-0 z-0">
                        <img src="${makeImgUrl(CONFIG.hero.imageUrl, 1600)}" alt="${CONFIG.hero.imageAlt}" class="w-full h-full object-cover opacity-30 filter blur-sm transform scale-105">
                        <div class="absolute inset-0 bg-gradient-to-b ${heroGradient}"></div>
                    </div>
                    <div class="relative z-10 text-center max-w-4xl px-4 fade-in-section">
                        <h1 class="font-serif text-5xl md:text-7xl font-bold mb-6 leading-tight">${CONFIG.meta.heroTitle}</h1>
                        <p class="text-xl md:text-2xl font-serif italic mb-8 ${dark ? 'text-gallery-200' : 'text-gallery-800'}">${CONFIG.meta.subtitle}</p>
                        <a href="#${CONFIG.sections[0].id}" class="inline-block border-2 px-8 py-3 uppercase tracking-widest text-sm transition-all duration-300 ${btnClasses}">${CONFIG.hero.ctaText}</a>
                    </div>
                </header>

                <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
            `;

            CONFIG.sections.forEach(sec => {
                const gridCols = sec.cards.length === 2 ? 'md:grid-cols-2' : (sec.cards.length === 3 ? 'md:grid-cols-3' : 'md:grid-cols-1 max-w-3xl mx-auto');
                const imgHeight = sec.cards.length === 2 ? 'h-64' : 'h-48';

                html += `
                    <section id="${sec.id}" class="py-16 md:py-24 border-b ${dark ? 'border-gallery-800' : 'border-gallery-200'} fade-in-section">
                        <div class="text-center max-w-3xl mx-auto mb-16">
                            <h2 class="text-xs uppercase tracking-widest text-amber-500 mb-2 font-bold">${sec.part}</h2>
                            <h3 class="font-serif text-4xl mb-6">${sec.title}</h3>
                            <p class="text-lg">${sec.intro}</p>
                        </div>

                        <div class="grid grid-cols-1 ${gridCols} gap-8">
                `;

                sec.cards.forEach((card) => {
                    const ps = card.paragraphs.map(p => `<p>${p}</p>`).join('');
                    const pos = card.imagePosition || 'object-center';
                    html += `
                        <div class="bg-gallery-900 text-gallery-100 p-6 md:p-8 art-shadow flex flex-col h-full border-t-4 border-gallery-800">
                            <img src="${makeImgUrl(card.imageUrl, 800)}" loading="lazy" alt="${card.imageAlt}" class="w-full ${imgHeight} object-cover ${pos} mb-6 cursor-pointer hover:opacity-90 transition-opacity" onclick="openLightbox('${makeImgUrl(card.imageUrl, 1600)}', '${card.imageCaption.replace(/'/g, "\\'")}')">
                            <h4 class="font-serif text-2xl mb-1">${card.name}</h4>
                            <span class="text-xs uppercase tracking-widest text-amber-500 mb-6 block">${card.label}</span>

                            <button class="w-full flex justify-between items-center py-2 text-sm font-bold uppercase tracking-wider text-gallery-200 hover:text-amber-500 transition-colors border-t border-gallery-800 focus:outline-none" onclick="toggleAccordion(this)">
                                Read More
                                <svg class="chevron w-4 h-4 transform transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </button>
                            <div class="accordion-content">
                                <div class="pt-4 space-y-4 text-sm flex-grow">
                                    ${ps}
                                </div>
                                <div class="mt-6 pt-4 border-t border-gallery-800">
                                    <strong class="text-amber-500 block mb-1">${card.footerLabel}</strong>
                                    <p class="text-sm">${card.footerText}</p>
                                </div>
                            </div>
                        </div>
                    `;
                });

                html += `</div>`;

                if (sec.blockquote) {
                    html += `
                        <blockquote class="border-l-4 border-amber-500 pl-6 my-16 max-w-4xl mx-auto font-serif italic text-2xl ${dark ? 'text-gallery-200' : 'text-gallery-800'}">
                            "${sec.blockquote.text}"
                            <footer class="text-sm uppercase tracking-widest mt-4 font-sans not-italic text-amber-500">— ${sec.blockquote.attribution}</footer>
                        </blockquote>
                    `;
                }

                if (sec.closingLine) {
                    html += `<p class="mt-12 text-center max-w-4xl mx-auto italic">${sec.closingLine}</p>`;
                }

                html += `</section>`;
            });

            html += `
                <section id="${CONFIG.coda.id}" class="py-16 md:py-24 fade-in-section">
                    <div class="max-w-4xl mx-auto">
                        <h2 class="text-xs uppercase tracking-widest text-amber-500 mb-2 font-bold text-center">${CONFIG.coda.part}</h2>
                        <h3 class="font-serif text-4xl mb-8 text-center">${CONFIG.coda.title}</h3>
                        <p class="text-xl mb-12 text-center font-serif">${CONFIG.coda.intro}</p>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-16">
            `;

            CONFIG.coda.cards.forEach(card => {
                html += `
                    <div class="bg-gallery-900 text-gallery-100 p-6 art-shadow border-t-4 border-gallery-800">
                        <h4 class="font-bold mb-3 text-lg text-amber-500">${card.title}</h4>
                        <p class="text-sm">${card.text}</p>
                    </div>
                `;
            });

            html += `
                        </div>
            `;
            if (CONFIG.coda.closingLine) {
                html += `<div class="bg-gallery-900 text-gallery-100 p-8 md:p-12 text-center art-shadow">
                            <h4 class="font-serif text-2xl text-amber-500 italic">${CONFIG.coda.closingLine}</h4>
                         </div>`;
            }
            html += `
                    </div>
                </section>
            </main>

            <footer class="bg-gallery-900 text-gallery-200 py-8 text-center text-sm">
                <p>${CONFIG.meta.footerText}</p>
            </footer>
            `;

            document.getElementById("app").innerHTML = html;
        }

        applyTheme(activeTheme);
        render();
        updatePickerUI();

        setTimeout(() => {
            const observerOptions = { root: null, rootMargin: '0px', threshold: 0.15 };
            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, observerOptions);
            document.querySelectorAll('.fade-in-section').forEach(section => observer.observe(section));
        }, 100);

    </script>
</body>
</html>
