    <script>
    // ─── TEMPLATE (do not edit below) ────────────────────────────────────────

    let activeTheme = CONFIG.themes.find(t => t.id === CONFIG.defaultTheme) || CONFIG.themes[0];

    function applyTheme(theme) {
        const r = document.documentElement;
        r.style.setProperty('--g50',  theme.colors[50]);
        r.style.setProperty('--g100', theme.colors[100]);
        r.style.setProperty('--g200', theme.colors[200]);
        r.style.setProperty('--g800', theme.colors[800]);
        r.style.setProperty('--g900', theme.colors[900]);
    }

    function togglePicker() {
        const panel = document.getElementById('picker-panel');
        if (panel.classList.contains('hidden')) {
            panel.innerHTML = CONFIG.themes.map(t => `
                <button onclick="switchTheme('${t.id}')"
                        style="display:block; width:100%; text-align:left; padding:8px 12px; font-size:0.8rem;
                               color:${activeTheme.id === t.id ? '#f59e0b' : 'var(--g100)'}; background:none; border:none; cursor:pointer;">
                    ${t.name}
                </button>`).join('');
            panel.classList.remove('hidden');
        } else {
            panel.classList.add('hidden');
        }
    }

    function switchTheme(themeId) {
        activeTheme = CONFIG.themes.find(t => t.id === themeId);
        applyTheme(activeTheme);
        document.getElementById('picker-panel').classList.add('hidden');
        render();
        document.querySelectorAll('.fade-in-section').forEach(el => el.classList.add('is-visible'));
    }

    function w(url, width) { return url + '?width=' + width; }

    function chevron() {
        return `<svg class="toggle-icon w-3 h-3 flex-shrink-0 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>`;
    }

    function renderCard(card, sIdx, cIdx, imgHeight) {
        const paras = card.paragraphs.map(p => `<p>${p}</p>`).join('');
        return `
        <div class="bg-gallery-900 text-gallery-100 p-8 art-shadow">
            <img src="${w(card.imageUrl, 800)}" loading="lazy" alt="${card.imageAlt}"
                 class="w-full ${imgHeight} object-cover object-center mb-6 cursor-pointer"
                 onclick="openCard(${sIdx}, ${cIdx})">
            <h4 class="font-serif text-2xl mb-1">${card.name}</h4>
            <span class="text-xs uppercase tracking-widest text-gallery-200 mb-3 block">${card.label}</span>
            <button onclick="toggleAccordion(this)" class="flex items-center gap-2 text-xs uppercase tracking-widest text-amber-500 hover:text-amber-400 transition-colors mb-1">
                ${chevron()}<span>Read more</span>
            </button>
            <div class="accordion-content">
                <div class="space-y-3 text-sm pt-2">${paras}</div>
                <div class="mt-6 pt-4 border-t border-gallery-800">
                    <strong class="text-amber-500 block mb-1">${card.footerLabel}</strong>
                    <p class="text-sm">${card.footerText}</p>
                </div>
            </div>
        </div>`;
    }

    function renderSection(section, sIdx) {
        const count = section.cards.length;
        const grid  = count === 3 ? 'grid-cols-1 md:grid-cols-3 gap-8' : 'grid-cols-1 md:grid-cols-2 gap-8';
        const imgH  = count === 2 ? 'h-64' : 'h-48';
        const cards = section.cards.map((c, cIdx) => renderCard(c, sIdx, cIdx, imgH)).join('');

        const bq = section.blockquote ? `
        <blockquote class="border-l-4 border-amber-500 pl-6 my-12 font-serif italic text-2xl max-w-3xl mx-auto">
            "${section.blockquote.text}"
            <cite class="block text-sm font-normal mt-2 not-italic text-gallery-200">— ${section.blockquote.attribution}</cite>
        </blockquote>` : '';

        const closing = section.closingLine ? `
        <p class="mt-10 text-center max-w-4xl mx-auto italic text-lg font-serif">${section.closingLine}</p>` : '';

        return `
        <section id="${section.id}" class="py-16 md:py-24 border-b border-gallery-800 fade-in-section">
            <div class="text-center max-w-3xl mx-auto mb-12">
                <h2 class="text-xs uppercase tracking-widest text-amber-500 mb-2 font-bold">${section.part}</h2>
                <h3 class="font-serif text-4xl mb-4">${section.title}</h3>
                <p class="text-lg">${section.intro}</p>
            </div>
            <div class="grid ${grid}">${cards}</div>
            ${bq}${closing}
        </section>`;
    }

    function renderCoda() {
        const { coda } = CONFIG;
        const cards = coda.cards.map(c => `
        <div class="bg-gallery-900 text-gallery-100 p-8 art-shadow flex flex-col">
            <h4 class="font-serif text-xl mb-3 text-amber-500">${c.title}</h4>
            <p class="text-sm flex-grow">${c.text}</p>
        </div>`).join('');

        return `
        <section id="${coda.id}" class="py-16 md:py-24 fade-in-section">
            <div class="text-center max-w-3xl mx-auto mb-12">
                <h2 class="text-xs uppercase tracking-widest text-amber-500 mb-2 font-bold">${coda.part}</h2>
                <h3 class="font-serif text-4xl mb-4">${coda.title}</h3>
                <p class="text-lg font-serif italic">${coda.intro}</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-12">${cards}</div>
            <p class="text-center max-w-2xl mx-auto text-lg font-serif italic text-gallery-200">${coda.closingLine}</p>
        </section>`;
    }

    function render() {
        const { meta, hero, sections, coda } = CONFIG;
        const dark = activeTheme.dark;
        const textMuted = dark ? 'text-gallery-200' : 'text-gallery-800';

        document.title = meta.pageTitle;

        document.body.className = `${dark ? 'bg-gallery-900 text-gallery-100' : 'bg-gallery-50 text-gallery-800'} font-sans antialiased selection:bg-amber-700 selection:text-white`;

        // Nav
        const navEl = document.getElementById('nav');
        navEl.className = `fixed w-full z-50 ${dark ? 'bg-gallery-900/95 border-gallery-800' : 'bg-gallery-50/90 border-gallery-200'} backdrop-blur-md border-b`;
        const navLinks = [
            `<a href="#" class="hover:text-amber-500 transition-colors">⌂</a>`,
            ...[...sections, coda].map(s =>
                `<a href="#${s.id}" class="hover:text-amber-500 transition-colors">${s.navLabel}</a>`)
        ].join('');
        navEl.innerHTML = `
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <span class="font-serif font-bold text-xl tracking-tight">${meta.shortTitle}</span>
                <div class="hidden md:flex space-x-8 text-sm uppercase tracking-wider font-semibold">${navLinks}</div>
            </div>
        </div>`;

        // Hero
        const heroBtn = dark
            ? 'border-gallery-200 text-gallery-100 hover:bg-gallery-100 hover:text-gallery-900'
            : 'border-gallery-800 text-gallery-800 hover:bg-gallery-800 hover:text-white';
        const heroGrad = dark
            ? 'from-gallery-900/30 via-gallery-900/70 to-gallery-900'
            : 'from-gallery-50/50 via-gallery-50/80 to-gallery-50';
        document.getElementById('hero').innerHTML = `
        <div class="absolute inset-0 z-0">
            <img src="${w(hero.imageUrl, 1600)}" alt="${hero.imageAlt}"
                 class="w-full h-full object-cover opacity-30 filter blur-sm transform scale-105">
            <div class="absolute inset-0 bg-gradient-to-b ${heroGrad}"></div>
        </div>
        <div class="relative z-10 text-center max-w-4xl px-4 fade-in-section is-visible">
            <h1 class="font-serif text-5xl md:text-7xl font-bold mb-6 ${dark ? 'text-gallery-50' : 'text-gallery-900'} leading-tight">${meta.heroTitle}</h1>
            <p class="text-xl md:text-2xl ${textMuted} font-serif italic mb-8">${meta.subtitle}</p>
            <a href="#${sections[0].id}"
               class="inline-block border-2 ${heroBtn} px-8 py-3 uppercase tracking-widest text-sm transition-all duration-300">
                ${hero.ctaText}
            </a>
        </div>`;

        // Sections + Coda
        document.getElementById('main').innerHTML =
            sections.map((s, i) => renderSection(s, i)).join('') + renderCoda();

        // Footer
        document.getElementById('footer').innerHTML = `<p>${meta.footerText}</p>`;

        // Scroll observer
        const obs = new IntersectionObserver((entries, o) => {
            entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('is-visible'); o.unobserve(e.target); } });
        }, { threshold: 0.15 });
        document.querySelectorAll('.fade-in-section').forEach(s => obs.observe(s));
    }

    // ─── INTERACTIONS ─────────────────────────────────────────────────────────

    function openCard(sIdx, cIdx) {
        const card = CONFIG.sections[sIdx].cards[cIdx];
        openModal(card.imageUrl + '?width=1600', card.imageCaption);
    }

    function toggleAccordion(btn) {
        const content = btn.nextElementSibling;
        const icon    = btn.querySelector('.toggle-icon');
        const label   = btn.querySelector('span');
        const isOpen  = content.style.maxHeight && content.style.maxHeight !== '0px';
        if (isOpen) {
            content.style.maxHeight = '0';
            icon.style.transform    = 'rotate(0deg)';
            label.textContent       = 'Read more';
        } else {
            content.style.maxHeight = content.scrollHeight + 'px';
            icon.style.transform    = 'rotate(180deg)';
            label.textContent       = 'Read less';
        }
    }

    const modal        = document.getElementById('imageModal');
    const modalImg     = document.getElementById('modalImage');
    const modalCaption = document.getElementById('modalCaption');

    function openModal(src, caption) {
        modalImg.src = src; modalCaption.innerText = caption;
        modal.classList.remove('hidden');
        setTimeout(() => { modal.classList.remove('opacity-0'); modal.classList.add('opacity-100'); }, 10);
        document.body.style.overflow = 'hidden';
    }
    function closeModal() {
        modal.classList.remove('opacity-100'); modal.classList.add('opacity-0');
        setTimeout(() => { modal.classList.add('hidden'); modalImg.src = ''; }, 300);
        document.body.style.overflow = '';
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !modal.classList.contains('hidden')) closeModal(); });
    modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

    // ─── GO ───────────────────────────────────────────────────────────────────
    applyTheme(activeTheme);
    render();
    </script>

</body>
</html>
